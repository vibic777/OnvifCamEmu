name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev,packaging]"
      - run: pytest
      - run: python packaging/build.py linux
      - uses: actions/upload-artifact@v4
        with:
          name: linux-onefile
          path: |
            dist/onvif-emulator-v*-linux-x86_64
            dist/*.tar.gz

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev,packaging]"
      - run: pytest
      - run: python packaging/build.py win
      - uses: actions/upload-artifact@v4
        with:
          name: windows-exe
          path: dist/*.exe

  publish:
    name: Publish GitHub Release
    needs: [linux, windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: "*"
          path: release-assets
          merge-multiple: false
      - name: Create checksums
        shell: bash
        run: |
          find release-assets -type f ! -name SHA256SUMS.txt -print0 | sort -z | xargs -0 sha256sum > release-assets/SHA256SUMS.txt
      - name: Attach assets and publish release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh release upload "$GITHUB_REF_NAME" release-assets/linux-onefile/* release-assets/windows-exe/* release-assets/SHA256SUMS.txt --clobber
          gh release edit "$GITHUB_REF_NAME" --draft=false
